name: Build release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pyautogui
      - run: pyinstaller --onefile --name tv_bot tv_bot.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/tv_bot.exe